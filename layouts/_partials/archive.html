{{/* Posts newest first (ordered by their hidden front-matter date), with
     dotted leaders out to the reading time. No dates are shown.
     Context: dict "pages" (posts) "current" (page or nil). */}}
{{ $current := .current }}
{{ range .pages }}
<a class="archive-item" href="{{ .RelPermalink }}"{{ if and $current (eq .RelPermalink $current.RelPermalink) }} aria-current="page"{{ end }}>
  <span class="title">{{ .Title }}</span>
  <span class="leader" aria-hidden="true"></span>
  <span class="meta">{{ .ReadingTime }} min</span>
</a>
{{ end }}
