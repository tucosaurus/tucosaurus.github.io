{{ define "main" }}
<header class="article-header">
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p class="dek">{{ . }}</p>{{ end }}
</header>
{{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}

<nav class="archive">
  {{ partial "archive.html" (dict "pages" .Pages "current" nil) }}
</nav>
{{ end }}
