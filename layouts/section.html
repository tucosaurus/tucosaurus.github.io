{{ define "main" }}
<header class="article-header">
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p class="dek">{{ . }}</p>{{ end }}
</header>
{{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}

{{ range .Pages.GroupByDate "2006" }}
<section class="year">
  <h2 class="label">{{ .Key }}</h2>
  {{ partial "post-list.html" .Pages }}
</section>
{{ end }}
{{ end }}
